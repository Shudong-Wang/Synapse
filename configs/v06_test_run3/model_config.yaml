# Six-jet ParT with one three-class event output.
model: synapse.models.ParticleTransformer.ParticleTransformerSimple
model_params:
  input_dim: 8
  global_input_dim: 35
  num_classes: 3
  pair_input_dim: 4
  use_pre_activation_pair: false
  embed_dims: [32, 128, 32]
  global_embed_dims: [32, 128, 32]
  pair_embed_dims: [16, 16, 16]
  num_heads: 4
  num_layers: 4
  num_cls_layers: 1
  fc_params: [[128, 0], [64, 0], [32, 0]]
  trim: false

output_names: [p_signal, p_bkg, p_extconv_bkg]
loss_function:
  name: synapse.loss_functions.distillation.DistilledEventCrossEntropy
  params:
    teacher_fraction: 0.75
    mean_train_weight: auto
optimizer: Adam
start_lr: 0.001
lr_scheduler: cosine
metrics:
  Accuracy:
    function: synapse.core.metrics.weighted_accuracy
    stages: [val, test]
    on_epoch: true
  AUC:
    function: synapse.core.metrics.weighted_auc
    stages: [val, test]
    on_epoch: true
  CM:
    function: synapse.core.metrics.weighted_confusion_matrix
    stages: [val, test]
    on_epoch: true
